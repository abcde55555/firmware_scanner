[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "firmware-scanner"
version = "0.38.0"
description = "Firmware security analysis, recursive unpacking, component extraction, and SBOM generation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Firmware Security Team" }]
keywords = [
    "firmware",
    "sbom",
    "security",
    "sca",
    "cyclonedx",
    "spdx",
    "vulnerability",
    "embedded",
    "rtos",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "capstone>=5.0.0",
    "lief>=0.14.0",
    "pyelftools>=0.31",
    "intelhex>=2.3.0",
    "packageurl-python>=0.11.0",
]

[project.urls]
Homepage = "https://github.com/abcde55555/firmware_scanner"
Documentation = "https://github.com/abcde55555/firmware_scanner/tree/main/docs"
Repository = "https://github.com/abcde55555/firmware_scanner"
Releases = "https://github.com/abcde55555/firmware_scanner/releases"
Issues = "https://github.com/abcde55555/firmware_scanner/issues"

[project.optional-dependencies]
radare2 = ["r2pipe>=1.8.0"]
ghidra = ["pyhidra>=1.0.0"]
android = ["lz4>=4.0.0"]
full = ["r2pipe>=1.8.0", "pyhidra>=1.0.0", "lz4>=4.0.0"]
corpus = ["tree-sitter==0.26.1", "tree-sitter-rust==0.24.2"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "mypy>=1.5",
    "ruff>=0.1.0",
    "tree-sitter==0.26.1",
    "tree-sitter-rust==0.24.2",
]

[project.scripts]
firmware-scanner = "firmware_scanner.cli.app:main"

[project.entry-points."firmware_scanner.rtos_plugins"]
freertos = "firmware_scanner.rtos.plugins.freertos:FreeRTOSPlugin"
zephyr = "firmware_scanner.rtos.plugins.zephyr:ZephyrPlugin"
rt_thread = "firmware_scanner.rtos.plugins.rt_thread:RTThreadPlugin"
esp_idf = "firmware_scanner.rtos.plugins.esp_idf:ESPIDFPlugin"
vxworks = "firmware_scanner.rtos.plugins.vxworks:VxWorksPlugin"
threadx = "firmware_scanner.rtos.plugins.threadx:ThreadXPlugin"
nuttx = "firmware_scanner.rtos.plugins.nuttx:NuttXPlugin"
liteos = "firmware_scanner.rtos.plugins.liteos:LiteOSPlugin"
ucos = "firmware_scanner.rtos.plugins.ucos:UCOSPlugin"

[project.entry-points."firmware_scanner.extractors"]
string_patterns = "firmware_scanner.extraction.extractors.string_patterns:StringPatternExtractor"
symbol_table = "firmware_scanner.extraction.extractors.symbol_table:SymbolTableExtractor"
disassembly = "firmware_scanner.extraction.extractors.disassembly:DisassemblyExtractor"
radare2 = "firmware_scanner.extraction.extractors.radare2_ext:Radare2Extractor"
ghidra = "firmware_scanner.extraction.extractors.ghidra_ext:GhidraExtractor"
binary_signatures = "firmware_scanner.extraction.extractors.binary_signatures:BinarySignatureExtractor"
manifest_scanner = "firmware_scanner.extraction.extractors.manifest_scanner:ManifestScannerExtractor"

[tool.hatch.build.targets.wheel]
packages = ["src/firmware_scanner"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/firmware_scanner",
  "/tests",
  "/docs",
  "/scripts",
  "/.github",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/pyproject.toml",
  "/firmware_scanner.spec",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
