name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional tag label used in asset names
        required: false
        type: string
      publish:
        description: Publish a GitHub Release after all builds pass
        required: true
        default: false
        type: boolean

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  packages:
    name: Python distribution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tools
        run: python -m pip install --upgrade pip
      - run: python -m pip install build==1.6.1 twine==7.0.0
      - name: Build wheel and source distribution
        run: python -m build
      - name: Check package metadata
        run: python -m twine check dist/*
      - name: Smoke-test the wheel
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          firmware-scanner --help
          firmware-scanner plugins
      - uses: actions/upload-artifact@v4
        with:
          name: python-packages
          path: dist/*
          if-no-files-found: error

  standalone:
    name: Standalone ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - windows-2022
          - macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and PyInstaller
        run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pyinstaller==6.22.3
      - name: Build standalone executable
        run: pyinstaller --clean --noconfirm firmware_scanner.spec
      - name: Sign macOS executable ad hoc
        if: runner.os == 'macOS'
        run: |
          codesign --force --sign - dist/firmware-scanner
          codesign --verify --verbose=2 dist/firmware-scanner
      - name: Smoke-test Unix executable
        if: runner.os != 'Windows'
        run: |
          ./dist/firmware-scanner --help
          ./dist/firmware-scanner plugins
      - name: Smoke-test Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\dist\firmware-scanner.exe --help
          .\dist\firmware-scanner.exe plugins
      - name: Package Unix executable
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p release-assets
          asset="firmware-scanner-${RELEASE_TAG}-${RUNNER_OS}-${RUNNER_ARCH}.tar.gz"
          tar -czf "release-assets/${asset}" -C dist firmware-scanner
      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $asset = "firmware-scanner-$env:RELEASE_TAG-$env:RUNNER_OS-$env:RUNNER_ARCH.zip"
          Compress-Archive -Path dist/firmware-scanner.exe -DestinationPath "release-assets/$asset"
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-${{ runner.os }}-${{ runner.arch }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push' || inputs.publish
    needs:
      - packages
      - standalone
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate checksums and release manifest
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path("release-assets")
          entries = []
          checksum_lines = []
          for path in sorted(item for item in root.iterdir() if item.is_file()):
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              entries.append(
                  {
                      "name": path.name,
                      "bytes": path.stat().st_size,
                      "sha256": digest,
                  }
              )
              checksum_lines.append(f"{digest}  {path.name}")

          (root / "SHA256SUMS").write_text("\n".join(checksum_lines) + "\n")
          manifest = {
              "schema_version": 1,
              "tag": os.environ["RELEASE_TAG"],
              "source_commit": os.environ["SOURCE_COMMIT"],
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "artifacts": entries,
          }
          (root / "release-manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n"
          )
          PY
      - name: Publish assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" release-assets/* --clobber
          else
            gh release create "${RELEASE_TAG}" release-assets/* \
              --verify-tag \
              --generate-notes \
              --title "Firmware Scanner ${RELEASE_TAG}"
          fi
