<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Firmware Scanner</title>
  <desc id="desc">Evidence-aware firmware SBOM and vulnerability analysis.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#0d2633"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#8dd8d0" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="280" rx="26" fill="url(#panel)"/>
  <rect width="1200" height="280" rx="26" fill="url(#grid)"/>
  <path d="M0 226 C180 170 300 292 470 224 S760 154 900 212 1100 176 1200 124" fill="none" stroke="#2dd4bf" stroke-opacity="0.12" stroke-width="2"/>

  <g transform="translate(92 54)">
    <rect x="18" y="18" width="144" height="144" rx="22" fill="#102f3b" stroke="#2dd4bf" stroke-width="2"/>
    <rect x="43" y="43" width="94" height="94" rx="12" fill="#071523" stroke="#60a5fa" stroke-width="2"/>
    <g fill="#2dd4bf">
      <rect x="27" y="52" width="18" height="7" rx="3"/>
      <rect x="27" y="76" width="18" height="7" rx="3"/>
      <rect x="27" y="100" width="18" height="7" rx="3"/>
      <rect x="135" y="52" width="18" height="7" rx="3"/>
      <rect x="135" y="76" width="18" height="7" rx="3"/>
      <rect x="135" y="100" width="18" height="7" rx="3"/>
      <rect x="52" y="9" width="7" height="18" rx="3"/>
      <rect x="76" y="9" width="7" height="18" rx="3"/>
      <rect x="100" y="9" width="7" height="18" rx="3"/>
      <rect x="52" y="153" width="7" height="18" rx="3"/>
      <rect x="76" y="153" width="7" height="18" rx="3"/>
      <rect x="100" y="153" width="7" height="18" rx="3"/>
    </g>
    <path d="M62 96 L83 75 L105 91 L121 66" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <circle cx="62" cy="96" r="5" fill="#60a5fa"/>
    <circle cx="83" cy="75" r="5" fill="#2dd4bf"/>
    <circle cx="105" cy="91" r="5" fill="#2dd4bf"/>
    <circle cx="121" cy="66" r="5" fill="#93c5fd"/>
  </g>

  <g transform="translate(324 67)" font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="0" y="0" fill="#5eead4" font-size="16" font-weight="700" letter-spacing="3">FIRMWARE SECURITY INTELLIGENCE</text>
    <text x="0" y="61" fill="#f8fafc" font-size="50" font-weight="700">Firmware Scanner</text>
    <text x="0" y="105" fill="#a9bac8" font-size="21" font-weight="400">Evidence-aware SBOM, component recovery, and CVE analysis</text>
    <text x="0" y="136" fill="#7f97aa" font-size="17" font-weight="400">for Android, embedded Linux, RTOS, and opaque firmware images.</text>
  </g>

  <g transform="translate(324 204)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">
    <rect x="0" y="0" width="138" height="34" rx="17" fill="#0f2c37" stroke="#2dd4bf" stroke-opacity="0.35"/>
    <text x="20" y="23" fill="#b8f4ea">STATIC</text>
    <rect x="151" y="0" width="152" height="34" rx="17" fill="#10263f" stroke="#60a5fa" stroke-opacity="0.35"/>
    <text x="171" y="23" fill="#bfdbfe">READ-ONLY</text>
    <rect x="316" y="0" width="199" height="34" rx="17" fill="#172035" stroke="#94a3b8" stroke-opacity="0.35"/>
    <text x="336" y="23" fill="#d7e2ec">EVIDENCE FIRST</text>
    <rect x="528" y="0" width="180" height="34" rx="17" fill="#132b2d" stroke="#34d399" stroke-opacity="0.35"/>
    <text x="548" y="23" fill="#bbf7d0">CYCLONEDX</text>
  </g>
</svg>
